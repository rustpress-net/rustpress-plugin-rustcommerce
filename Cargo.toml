[package]
name = "rustcommerce"
version = "1.0.0"
edition = "2021"
description = "Enterprise e-commerce plugin for RustPress CMS"
license = "MIT"
repository = "https://github.com/rustpress-net/rustpress-plugin-rustcommerce"
authors = ["RustPress Team"]
keywords = ["ecommerce", "rustpress", "plugin", "cms"]

[lib]
name = "rustcommerce"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }

# Types
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.0", features = ["serde-with-str"] }

# Stripe
async-stripe = { version = "0.39", default-features = false, features = ["runtime-tokio-hyper"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }
slug = "0.1"

# RustPress core (path dependency - uncomment when building with core)
# rustpress-core = { path = "../rustpress-core-base/crates/rustpress-core" }
# rustpress-database = { path = "../rustpress-core-base/crates/rustpress-database" }
# rustpress-auth = { path = "../rustpress-core-base/crates/rustpress-auth" }

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
rust_decimal = { version = "1.0", features = ["serde-with-str"] }
rust_decimal_macros = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde_json = "1.0"
validator = { version = "0.18", features = ["derive"] }
async-stripe = { version = "0.39", default-features = false, features = ["runtime-tokio-hyper"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
